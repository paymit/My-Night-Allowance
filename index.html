<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Night Allowance Calculator</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #111111;
        color: white;
        min-height: 100vh;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .calculator {
        width: 100%;
        max-width: 500px;
        background: #000000;
        border: 1px solid #444;
        padding: 25px;
    }

    h1 {
        text-align: center;
        font-size: 25px;
        margin-bottom: 30px;
        letter-spacing: 1px;
    }

    .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border: 1px solid #888;
        min-height: 60px;
    }

    .label {
        padding: 17px 12px;
        font-size: 18px;
        font-weight: bold;
        border-right: 1px solid #888;
        display: flex;
        align-items: center;
    }

    input,
    .result {
        width: 100%;
        background: #111;
        color: white;
        border: none;
        padding: 12px;
        font-size: 19px;
        text-align: right;
        outline: none;
    }

    input:focus {
        outline: 2px solid #2d70c9;
    }

    .result {
        display: flex;
        align-items: center;
        justify-content: flex-end;
    }

    .highlight {
        border: 2px solid white;
        margin-top: 10px;
    }

    .net-pay {
        background: #0b0b0b;
        font-size: 22px;
        font-weight: bold;
    }

    .buttons {
        display: flex;
        gap: 10px;
        margin-top: 25px;
    }

    button {
        flex: 1;
        padding: 15px;
        border: none;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .reset {
        background: #555;
        color: white;
    }

    .reset:hover {
        background: #777;
    }

    .info {
        margin-top: 20px;
        color: #aaa;
        font-size: 12px;
        text-align: center;
    }
</style>
</head>

<body>

<div class="calculator">

    <h1>NIGHT ALLOWANCE CALCULATOR</h1>

    <div class="row">
        <div class="label">BASE SALARY</div>
        <input 
            type="number" 
            id="baseSalary" 
            placeholder="0.00"
            oninput="calculate()"
        >
    </div>

    <div class="row">
        <div class="label">NIGHT DAYS</div>
        <input 
            type="number" 
            id="nightDays" 
            placeholder="0"
            oninput="calculate()"
        >
    </div>

    <div class="row">
        <div class="label">NIGHT ALLOWANCE</div>
        <div class="result" id="nightAllowance">0.00</div>
    </div>

    <div class="row highlight">
        <div class="label">NETT PAY</div>
        <div class="result net-pay" id="nettPay">0.00</div>
    </div>

    <div class="buttons">
        <button class="reset" onclick="resetCalculator()">RESET</button>
    </div>

    <div class="info">
        Formula: 0.014417531637701 × Base Salary × Night Days
    </div>

</div>


<script>

function calculate() {

    const baseSalary =
        parseFloat(document.getElementById("baseSalary").value) || 0;

    const nightDays =
        parseFloat(document.getElementById("nightDays").value) || 0;


    // EXACT FORMULA FROM YOUR EXCEL SHEET

    const nightAllowance =
        0.014417531637701 * baseSalary * nightDays;


    document.getElementById("nightAllowance").innerText =
        nightAllowance.toLocaleString("en-NG", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });


    document.getElementById("nettPay").innerText =
        nightAllowance.toLocaleString("en-NG", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

}


function resetCalculator() {

    document.getElementById("baseSalary").value = "";
    document.getElementById("nightDays").value = "";

    document.getElementById("nightAllowance").innerText = "0.00";
    document.getElementById("nettPay").innerText = "0.00";

}

</script>

</body>
</html>
